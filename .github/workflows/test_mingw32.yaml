name: Test restored MinGW32

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          # Do not use MINGW32 here.
          msystem: MSYS
          update: true
          install: >-
            git
            make
            base-devel
            autoconf
            automake
            libtool
            nasm
            ncurses
            binutils

      - name: Export MSYS2 location
        run: |
          echo "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}" >> $GITHUB_ENV
          echo "MSYSTEM_PREFIX=${{ steps.msys2.outputs.msys2-location }}/mingw32" >> $GITHUB_ENV

      - name: Download MinGW32 toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "maron2000/MinGW32"
          $dir = "D:\a\MinGW32\MinGW32"

          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $tag = gh release list `
            --repo $repo `
            --limit 30 `
            --exclude-drafts `
            --exclude-pre-releases `
            --json tagName `
            --jq '.[] | select(.tagName | startswith("mingw32-")) | .tagName' |
            Select-Object -First 1

          if (-not $tag) {
            Write-Error "No MinGW32 release found."
          }

          Write-Host "Downloading MinGW32 release: $tag"

          gh release download $tag `
            --repo $repo `
            --pattern "mingw32-toolchain.tar.xz" `
            --dir $dir

      - name: Restore MinGW32
        run: |
          MSYS2_ROOT="/${MSYS2_LOCATION:0:1}${MSYS2_LOCATION:2}"
          MSYS2_ROOT="${MSYS2_ROOT//\\//}"

          echo "MSYS2_LOCATION=$MSYS2_LOCATION"
          echo "MSYS2_ROOT=$MSYS2_ROOT"

          tar -xJf mingw32-toolchain.tar.xz -C "$MSYS2_ROOT"

          test -x /mingw32/bin/gcc.exe
          test -x /mingw32/bin/g++.exe
          test -x /mingw32/bin/ld.exe

      - name: Check MinGW32 toolchain
        run: |
          export MINGW_PREFIX=/mingw32
          export MINGW_PACKAGE_PREFIX=mingw-w64-i686
          export PATH="/mingw32/bin:/usr/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw32/lib/pkgconfig:/mingw32/share/pkgconfig"
          export ACLOCAL_PATH="/mingw32/share/aclocal:/usr/share/aclocal"

          echo "MSYSTEM=$MSYSTEM"
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          echo "MINGW_PACKAGE_PREFIX=$MINGW_PACKAGE_PREFIX"


          which gcc
          which g++
          which ld

          gcc --version
          g++ --version
          ld --version

          echo
          echo "=== GCC target ==="
          gcc -dumpmachine

          echo
          echo "=== GCC search directories ==="
          gcc -print-search-dirs

          echo
          echo "=== GCC sysroot ==="
          gcc -print-sysroot

          echo
          echo "=== C++ library ==="
          gcc -print-file-name=libstdc++.a

          echo
          echo "=== C library ==="
          gcc -print-file-name=libmingw32.a

      - name: Download DOSBox-X source
        run: |
          git clone --depth 1 https://github.com/joncampbell123/dosbox-x.git dosbox-x

      - name: Build DOSBox-X on MinGW32
        if: false
        working-directory: dosbox-x
        run: |
          export MINGW_PREFIX=/mingw32
          export MINGW_PACKAGE_PREFIX=mingw-w64-i686
          export PATH="/mingw32/bin:/usr/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw32/lib/pkgconfig:/mingw32/share/pkgconfig"
          export ACLOCAL_PATH="/mingw32/share/aclocal:/usr/share/aclocal"

          echo "MSYSTEM=$MSYSTEM"
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          echo "MINGW_PACKAGE_PREFIX=$MINGW_PACKAGE_PREFIX"

          which gcc
          gcc --version
          gcc -dumpmachine

          $top=`pwd`
          echo "Compiling our internal SDL 2.x"
          (cd vs/sdl2 && ./build-dosbox.sh) || exit 1
          new="-I${top}/vs/sdl2/linux-host/include "
          nld="-L${top}/vs/sdl2/linux-host/lib "
          LDFLAGS="${nld}${LDFLAGS}"
          CPPFLAGS="${new}${CPPFLAGS}"
          export LDFLAGS CPPFLAGS

          ./build-mingw-sdl2

      - name: Download MinGW32 toolchain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "maron2000/MinGW32"
          $dir = "D:\a\MinGW32\MinGW32"

          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $tag = gh release list `
            --repo $repo `
            --limit 30 `
            --exclude-drafts `
            --exclude-pre-releases `
            --json tagName `
            --jq '.[] | select(.tagName | startswith("mingw64-")) | .tagName' |
            Select-Object -First 1

          if (-not $tag) {
            Write-Error "No MinGW64 release found."
          }

          Write-Host "Downloading MinGW64 release: $tag"

          gh release download $tag `
            --repo $repo `
            --pattern "mingw64-toolchain.tar.xz" `
            --dir $dir

      - name: Restore MinGW64
        run: |

          MSYS2_ROOT="/${MSYS2_LOCATION:0:1}${MSYS2_LOCATION:2}"
          MSYS2_ROOT="${MSYS2_ROOT//\\//}"

          echo "MSYS2_LOCATION=$MSYS2_LOCATION"
          echo "MSYS2_ROOT=$MSYS2_ROOT"

          tar -xJf mingw64-toolchain.tar.xz -C "$MSYS2_ROOT"

          test -x /mingw64/bin/gcc.exe
          test -x /mingw64/bin/g++.exe
          test -x /mingw64/bin/ld.exe

      - name: Build DOSBox-X on MinGW64
        working-directory: dosbox-x
        run: |
          export MINGW_PREFIX=/mingw64
          export MINGW_PACKAGE_PREFIX=mingw-w64-x86_64
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig"
          export ACLOCAL_PATH="/mingw64/share/aclocal:/usr/share/aclocal"

          echo "MSYSTEM=$MSYSTEM"
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          echo "MINGW_PACKAGE_PREFIX=$MINGW_PACKAGE_PREFIX"

          which gcc
          gcc --version
          gcc -dumpmachine

          top=`pwd`
          echo "Compiling our internal SDL 2.x"
          (cd vs/sdl2 && ./build-dosbox.sh) || exit 1
          new="-I${top}/vs/sdl2/linux-host/include "
          nld="-L${top}/vs/sdl2/linux-host/lib "
          LDFLAGS="${nld}${LDFLAGS}"
          CPPFLAGS="${new}${CPPFLAGS}"
          export LDFLAGS CPPFLAGS

          ./build-mingw-sdl2

